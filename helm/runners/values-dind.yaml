# Values for gha-runner-scale-set с поддержкой Docker-in-Docker (DinD)
# Используйте этот файл, если вашим тестам потребуется docker build, docker run или docker compose.
githubConfigUrl: "https://github.com/REPLACE_WITH_YOUR_USER/REPLACE_WITH_YOUR_REPO"

githubConfigSecret: arc-runner-secret

# Чтобы не конфликтовать со стандартным, можно назвать runnerScaleSetName: arc-runner-dind
# Тогда в workflow можно писать: `runs-on: arc-runner-dind`
runnerScaleSetName: "arc-runner-dind"

minRunners: 0
maxRunners: 5

template:
  spec:
    priorityClassName: ci-runner-low
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        command: ["cp", "-r", "-v", "/home/runner/externals/.", "/dind-externals/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /dind-externals
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: tcp://localhost:2376
          - name: DOCKER_TLS_VERIFY
            value: "1"
          - name: DOCKER_CERT_PATH
            value: /certs/client
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-certs
            mountPath: /certs/client
            readOnly: true
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 6Gi
      - name: dind
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        args:
          - --storage-driver=overlay2
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: /certs
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-certs
            mountPath: /certs/client
          - name: dind-externals
            mountPath: /home/runner/externals
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-certs
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
