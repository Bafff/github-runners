# Bafff/pt309-clone CI (fmt, Clippy, Rust tests with coverage, Wasm, PostGIS crosscheck).
# The repository went private on GitHub Free, where hosted-runner minutes are capped
# (homelab-hosts docs/sonarqube). dind because the crosscheck job starts a postgis service.
githubConfigUrl: "https://github.com/Bafff/pt309-clone"
githubConfigSecret: arc-runner-secret
runnerScaleSetName: "pt309-5950x"
minRunners: 0
# check, wasm, crosscheck and web run in parallel for one push; 6 lets a second push or PR
# start before the first finishes. At 7 GiB requests per pod, 6 take ~42 of the CI node's
# ~50 GiB Allocatable; pods that do not fit beside the other CI pools wait in Pending.
# Maintenance homelab-hosts#110: restore maxRunners: 6 after prod resize.
maxRunners: 0

template:
  spec:
    # Runs pull-request code: no cluster credentials.
    automountServiceAccountToken: false
    priorityClassName: ci-runner-low
    # CI node of the 5950x cluster (homelab-hosts spec 2026-10-16-ci-node-p3600).
    nodeSelector:
      homelab.dev/pool: ci
    tolerations:
      - {key: homelab.dev/pool, operator: Equal, value: ci, effect: NoSchedule}
    initContainers:
      - name: init-network-mtu
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        command: ["sh", "-c", "ip link set dev eth0 mtu 1280"]
        securityContext:
          privileged: true
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        # dind is a plain sibling container, so nothing orders its start: wait for dockerd before
        # taking a job, or the job's first docker step or service fails. No `$` here: Kubernetes
        # expands $(...) in command.
        command:
          - sh
          - -c
          - >-
            timeout 120 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
            || { echo "dockerd not ready after 120s" >&2; exit 1; };
            exec /home/runner/run.sh
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          # Fixed, not the 28 CPUs WSL reports: the pod has no CPU limit (CPU limits only by
          # agreement, homelab-hosts AGENTS.md), and more jobs would not fit the 6Gi memory below.
          - name: CARGO_BUILD_JOBS
            value: "8"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
        # cgroup memory.peak, page cache included, one run on 2026-10-17 (run 39079926810):
        # check 4.0G, web 3.9G, wasm 3.6G, crosscheck 2.6G. web (npm ci, Vitest coverage,
        # Vite build) is as heavy as the Rust jobs. requests = limits for memory so excess
        # jobs queue instead of evicting.
        resources:
          requests:
            cpu: 2000m
            memory: 6Gi
            ephemeral-storage: 2Gi
          limits:
            memory: 6Gi
            ephemeral-storage: 20Gi
      - name: dind
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --mtu=1280
          - --default-network-opt=bridge=com.docker.network.driver.mtu=1280
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
        # dockerd plus one postgis/postgis:16-3.4 service container: 0.88G peak in
        # crosscheck and web, 0.02G in check and wasm (same run as above).
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
            ephemeral-storage: 1Gi
          limits:
            memory: 1536Mi
            ephemeral-storage: 10Gi
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 20Gi
      - name: dind-storage
        emptyDir:
          sizeLimit: 10Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}

controllerServiceAccount:
  namespace: "arc-systems"
  name: "arc-gha-rs-controller"
