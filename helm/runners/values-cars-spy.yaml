# Bafff/cars-spy spillover CI (`cars-spy-nitro` overflow) and `Release` pool: ephemeral DinD for Rust + ONNX checks/tests and GHCR image builds.
githubConfigUrl: "https://github.com/Bafff/cars-spy"
githubConfigSecret: arc-runner-secret
runnerScaleSetName: "cars-spy-5950x"
minRunners: 0
maxRunners: 2

template:
  spec:
    # Runs pull-request code: no cluster credentials.
    automountServiceAccountToken: false
    priorityClassName: ci-runner-low
    # CI node of the 5950x cluster (homelab-hosts spec 2026-10-16-ci-node-p3600).
    nodeSelector:
      homelab.dev/pool: ci
    tolerations:
      - {key: homelab.dev/pool, operator: Equal, value: ci, effect: NoSchedule}
    initContainers:
      - name: init-network-mtu
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        command: ["sh", "-c", "ip link set dev eth0 mtu 1280"]
        securityContext:
          privileged: true
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        # dind is a plain sibling container, so nothing orders its start: wait for dockerd before
        # taking a job.
        command:
          - sh
          - -c
          - >-
            timeout 120 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
            || { echo "dockerd not ready after 120s" >&2; exit 1; };
            exec /home/runner/run.sh
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          # Single source of truth for parallelism on `5950x` (`4`, vs `3` on `nitro-wsl-cars-spy`):
          # forwarded into toolchain containers by `tools/test-suite.sh` (`-e CARGO_BUILD_JOBS`) and
          # into BuildKit by `ci.yaml` / `tools/release/image.sh` (`--build-arg CARGO_BUILD_JOBS`).
          - name: CARGO_BUILD_JOBS
            value: "4"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
        # Measured 2026-11-18 and updated 2026-11-26 (homelab-hosts #322): `runner` only runs
        # git, `uvx yamllint`, kustomize, and the docker CLI (~200 MiB RSS), while Rust/ONNX
        # compile + PG18 tests + `--release` LTO image build run inside `dind`. As `cars-spy`
        # grew to 145 Rust files / 38 integration test crates, two parallel `rustc` processes
        # reached 3.27 GiB anon RSS alone (thrashing 3.5 GiB swapless DinD on nitro), so `dind`
        # is raised from 4Gi to 8Gi to match `nitro` and `lenovo`.
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 1Gi
          limits:
            memory: 1Gi
            ephemeral-storage: 5Gi
      - name: dind
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --mtu=1280
          - --default-network-opt=bridge=com.docker.network.driver.mtu=1280
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
        resources:
          requests:
            cpu: "1"
            memory: 8Gi
            ephemeral-storage: 1Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 15Gi
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 5Gi
      - name: dind-storage
        emptyDir:
          sizeLimit: 15Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}

controllerServiceAccount:
  namespace: "arc-systems"
  name: "arc-gha-rs-controller"

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
