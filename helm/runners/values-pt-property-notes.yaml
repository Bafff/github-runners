# Bafff/pt-property-notes `publish` (.github/workflows/publish.yml): renders the notes behind
# docs.owl-projects.com to static HTML with Bafff/owl-docs (python + pinned pandoc tarball) and
# pushes the `site` and `release` branches. No docker, no cluster: no dind, no service account.
# Private repo on GitHub Free with hosted runs stopped on billing (homelab-hosts
# docs/plans/2026-10-18-docs-in-cluster.md).
githubConfigUrl: "https://github.com/Bafff/pt-property-notes"
githubConfigSecret: arc-runner-secret
runnerScaleSetName: "pt-property-notes-5950x"
minRunners: 0
# publish runs under one concurrency group: one runner is enough.
maxRunners: 1

template:
  spec:
    # The job has the repository's contents:write token and a read-only deploy key for owl-docs;
    # it needs no cluster credentials.
    automountServiceAccountToken: false
    priorityClassName: ci-runner-low
    # CI node of the 5950x cluster (homelab-hosts spec 2026-10-16-ci-node-p3600).
    nodeSelector:
      homelab.dev/pool: ci
    tolerations:
      - {key: homelab.dev/pool, operator: Equal, value: ci, effect: NoSchedule}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        command: ["/home/runner/run.sh"]
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
        # An estimate, not a measured peak: setup-python, a pandoc process per note (13 notes) and
        # Runner.Worker. requests = limits for memory so excess jobs queue instead of evicting.
        # No CPU limit (only by agreement, homelab-hosts AGENTS.md).
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
            ephemeral-storage: 1Gi
          limits:
            memory: 1Gi
            ephemeral-storage: 5Gi
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 5Gi

controllerServiceAccount:
  namespace: "arc-systems"
  name: "arc-gha-rs-controller"
