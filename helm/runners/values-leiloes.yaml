# Bafff/leiloes-radar CI (.github/workflows/ci.yaml, one job `test`): ruff, yamllint, pytest (xdist)
# over unit + integration tests, docker build and smoke run of the scraper image. The repository is
# private on GitHub Free and hosted runs stopped on billing, so CI moves here. dind because the job
# starts a postgres service (127.0.0.1:5432 through the shared pod network namespace) and runs
# docker build/run.
githubConfigUrl: "https://github.com/Bafff/leiloes-radar"
githubConfigSecret: arc-runner-secret
# `runs-on: leiloes-ci` means any Radar runner: this pool, and the host runners on nitro and the Mac
# (Bafff/homelab-hosts hosts/nitro, hosts/alexs-macbook-pro/ci) register with the same label. ARC
# sets a scale set's labels only when it creates it, and this name is its only label. Until
# 2026-11-09 the pool was called leiloes-5950x.
runnerScaleSetName: "leiloes-ci"
minRunners: 0
# One job per workflow run; a pull request and a push to main can overlap.
# Total pod memory is 9Gi (6Gi runner + 3Gi dind), max 18Gi at maxRunners: 2, on the ~50 GiB
# Allocatable CI node. Coexists comfortably with idealista-5950x (13.5Gi each):
# 1 × idealista + 1 × leiloes = 22.5Gi, and even 2 × idealista + 2 × leiloes = 45Gi fits.
maxRunners: 2

template:
  spec:
    # Runs pull-request code: no cluster credentials.
    automountServiceAccountToken: false
    priorityClassName: ci-runner-low
    # CI node of the 5950x cluster (homelab-hosts spec 2026-10-16-ci-node-p3600).
    nodeSelector:
      homelab.dev/pool: ci
    tolerations:
      - {key: homelab.dev/pool, operator: Equal, value: ci, effect: NoSchedule}
    initContainers:
      - name: init-network-mtu
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        command: ["sh", "-c", "ip link set dev eth0 mtu 1280"]
        securityContext:
          privileged: true
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        # dind is a plain sibling container, so nothing orders its start: wait for dockerd before
        # taking a job, or the postgres service of the first job fails. No `$` here: Kubernetes
        # expands $(...) in command.
        command:
          - sh
          - -c
          - >-
            timeout 120 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
            || { echo "dockerd not ready after 120s" >&2; exit 1; };
            exec /home/runner/run.sh
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          # Read by Bafff/leiloes-radar CI (${PYTEST_XDIST_NUMPROCESSES:-4}) so 5950x runs 10 xdist
          # workers without affecting smaller host runners (nitro/Mac). Fixed because the pod has no
          # CPU limit (only by agreement, homelab-hosts AGENTS.md) and 6Gi memory below is sized for
          # 10 workers.
          - name: PYTEST_XDIST_NUMPROCESSES
            value: "10"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
        # An estimate, not a measured CI peak: local `make test-unit` (-n 4) peaked at ~370 MB RSS
        # per process on 2026-10-17. 6Gi covers pip install, 10 xdist workers over unit +
        # integration tests, and Runner.Worker. requests = limits for memory so excess pods queue in
        # Pending instead of evicting. No CPU limit (only by agreement, homelab-hosts AGENTS.md);
        # requests.cpu 2000m matches values-pt309.yaml. Measure after rollout before tuning.
        resources:
          requests:
            cpu: 2000m
            memory: 6Gi
            ephemeral-storage: 1Gi
          limits:
            memory: 6Gi
            ephemeral-storage: 10Gi
      - name: dind
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --mtu=1280
          - --default-network-opt=bridge=com.docker.network.driver.mtu=1280
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
        # dockerd, the postgres:18.4 service container (with `--tmpfs /var/lib/postgresql:rw,size=1g`),
        # and BuildKit running pip install for the python:3.14.6-slim scraper image: 3Gi leaves
        # headroom for 1 GiB tmpfs + Postgres + BuildKit (an estimate, not a measured peak).
        # requests = limits for memory so excess pods queue in Pending instead of evicting.
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
            ephemeral-storage: 1Gi
          limits:
            memory: 3Gi
            ephemeral-storage: 10Gi
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 10Gi
      - name: dind-storage
        emptyDir:
          sizeLimit: 10Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}

controllerServiceAccount:
  namespace: "arc-systems"
  name: "arc-gha-rs-controller"

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
