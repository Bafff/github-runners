# Jobs that need neither docker nor the cluster: lint, file checks, manifest
# render, release bookkeeping. Kept off idealista-5950x so a 10-second check
# does not hold one of its two dind slots while pytest waits in the queue.
githubConfigUrl: "https://github.com/Bafff/idealista-tracker"
githubConfigSecret: arc-runner-secret
runnerScaleSetName: "idealista-5950x-light"
minRunners: 0
maxRunners: 4

template:
  spec:
    # Runs pull-request code, like idealista-5950x: no cluster credentials.
    automountServiceAccountToken: false
    priorityClassName: ci-runner-low
    # CI node of the 5950x cluster (homelab-hosts spec 2026-10-16-ci-node-p3600): tainted for runners,
    # its own memory and disk (P3600). Production never lands there, so requests can equal the real peak.
    nodeSelector:
      homelab.dev/pool: ci
    tolerations:
      - {key: homelab.dev/pool, operator: Equal, value: ci, effect: NoSchedule}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        command: ["/home/runner/run.sh"]
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
            ephemeral-storage: 5Gi
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 5Gi

controllerServiceAccount:
  namespace: "arc-systems"
  name: "arc-gha-rs-controller"
