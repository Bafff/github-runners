githubConfigUrl: "https://github.com/Bafff/idealista-tracker"
githubConfigSecret: arc-runner-secret
runnerScaleSetName: "idealista-5950x"
minRunners: 0
maxRunners: 4

template:
  spec:
    automountServiceAccountToken: false
    priorityClassName: ci-runner-low
    # CI node of the 5950x cluster (homelab-hosts spec 2026-10-16-ci-node-p3600): tainted for runners,
    # its own memory and disk (P3600). Production never lands there, so requests can equal the real peak.
    nodeSelector:
      homelab.dev/pool: ci
    tolerations:
      - {key: homelab.dev/pool, operator: Equal, value: ci, effect: NoSchedule}
    initContainers:
      - name: init-network-mtu
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        command: ["sh", "-c", "ip link set dev eth0 mtu 1280"]
        securityContext:
          privileged: true
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
        # dind is a plain sibling container, so nothing orders its start: wait for dockerd before
        # taking a job, or the job's first docker step or service fails. No `$` here: Kubernetes
        # expands $(...) in command.
        command:
          - sh
          - -c
          - >-
            timeout 120 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
            || { echo "dockerd not ready after 120s" >&2; exit 1; };
            exec /home/runner/run.sh
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          # pytest -n auto takes its worker count from this (pytest-xdist reads it): the CI node's 19
          # allocatable CPUs, not the 28 CPUs WSL reports. Fixed because the pod has no CPU limit (CPU
          # limits only by agreement, homelab-hosts AGENTS.md); the 12Gi memory below is sized for 19.
          - name: PYTEST_XDIST_AUTO_NUM_WORKERS
            value: "19"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
        # One runner uses the whole CI node (19 allocatable CPUs) when it runs alone; up to three fit in
        # the node's ~50 GiB Allocatable memory at 13.5 GiB per pod (12 GiB runner + 1.5 GiB dind), and a
        # fourth queues in Pending until a slot frees.
        # Memory is the real limit: -n 4 ~2.9 GiB, -n 8 ~4.4, -n 16 ~6.7 (idealista ci.yml); -n 19 hit the
        # 8 GiB cgroup limit (19 workers + pytest controller + Runner.Worker + kernel slab/pagetables), so
        # 12 GiB gives ~3.5-4 GiB of headroom. requests = limits so the scheduler queues excess jobs
        # instead of evicting running pods.
        resources:
          requests:
            cpu: 4000m
            memory: 12Gi
            ephemeral-storage: 1Gi
          limits:
            memory: 12Gi
            ephemeral-storage: 10Gi
      - name: dind
        image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --mtu=1280
          - --default-network-opt=bridge=com.docker.network.driver.mtu=1280
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
        # dockerd plus the one postgres:15-alpine container that
        # tests/test_migration_test_db_script.py starts: an estimate, not a
        # measured peak; if a run OOMs here, measure before raising.
        resources:
          requests:
            cpu: 500m
            memory: 1536Mi
            ephemeral-storage: 1Gi
          limits:
            memory: 1536Mi
            ephemeral-storage: 20Gi
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 10Gi
      - name: dind-storage
        emptyDir:
          sizeLimit: 20Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}

controllerServiceAccount:
  namespace: "arc-systems"
  name: "arc-gha-rs-controller"
