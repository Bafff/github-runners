# Шаблон секрета для доступа ARC к GitHub
# Скопируйте этот файл в github-secret.yaml, заполните токен и примените:
# kubectl apply -f github-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: arc-runner-secret
  namespace: arc-runners
type: Opaque
stringData:
  # Если используется Personal Access Token (PAT):
  github_token: "ghp_YOUR_PERSONAL_ACCESS_TOKEN"

  # ИЛИ если используется GitHub App (рекомендуется для prod):
  # github_app_id: "123456"
  # github_app_installation_id: "654321"
  # github_app_private_key: |
  #   -----BEGIN RSA PRIVATE KEY-----
  #   ...
  #   -----END RSA PRIVATE KEY-----
