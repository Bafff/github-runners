apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-runners-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_YOUR_USER/github-runners.git
    targetRevision: HEAD
    path: apps
    directory:
      recurse: false
      exclude: 'root-app.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
