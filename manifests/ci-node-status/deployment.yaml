apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-node-status
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: ci-node-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-node-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-node-status
    spec:
      serviceAccountName: ci-node-status
      automountServiceAccountToken: true
      # Pin to the CI node (k3d-5950x-ci-0) so spec.nodeName reports the CI node
      # and /proc/loadavg + /proc/meminfo are read there (note: on k3d without lxcfs,
      # /proc reflects the underlying WSL2 host kernel rather than the k3d node's
      # Docker cgroup memory limit).
      nodeSelector:
        homelab.dev/pool: ci
      tolerations:
        - key: homelab.dev/pool
          operator: Equal
          value: ci
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ci-node-status
          image: ghcr.io/bafff/ci-node-status:sha-db32961b7824@sha256:32f51e5c6ba4dc2033f4041b7d00ed2e542d0444c435005b96398559f6db5567
          env:
            - name: PORT
              value: "8080"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Optional comma-separated extra scale-set names or globs to exclude
            # in addition to the default suffixes (-route, -light, -deploy) and
            # prefix (sonarqube-*).
            - name: LIGHT_SCALE_SETS
              value: ""
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No CPU limit (only by agreement, README.md / homelab-hosts AGENTS.md).
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
              ephemeral-storage: 4Mi
            limits:
              memory: 24Mi
              ephemeral-storage: 16Mi
