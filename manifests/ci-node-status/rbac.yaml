# Minimal namespace-scoped read-only RBAC for ci-node-status.
# CI runner pods themselves keep automountServiceAccountToken: false.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-node-status
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-node-status
  namespace: arc-runners
rules:
  - apiGroups: ["actions.github.com"]
    resources: ["ephemeralrunners", "autoscalingrunnersets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-node-status
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: ci-node-status
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-node-status
